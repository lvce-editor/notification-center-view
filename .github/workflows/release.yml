name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  id-token: write
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
        env:
          RG_VERSION: ${{ github.ref_name }}
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - run: npm pack .tmp/dist --pack-destination .tmp
      - uses: softprops/action-gh-release@v2
        with:
          files: .tmp/lvce-editor-notification-center-view-*.tgz
